# Remote userdocker node.
#
# Run this on any machine that should host userdocker containers. The machine
# needs no public address — user-docker-manager dials OUT to the orchestrator
# (/api/v1/nodes/connect) and serves its API back over that tunnel.
#
#   ORCHESTRATOR_PUBLIC_URL=http://your-hub-host:18080 \
#   NODE_NAME=gpu-box-1 NODE_TOKEN=<same-token-as-hub> \
#   docker compose -f docker-compose.node.yml up --build
#
# The userdocker-base / userdocker-golang services below are build-only
# helpers so the framework images exist on this machine's docker daemon.

networks:
  whalebot_net:
    name: whalebot_net

services:
  user-docker-manager:
    build: ./user-docker-manager
    image: whalebot/user-docker-manager:latest
    container_name: user-docker-manager
    environment:
      USER_DOCKER_MANAGER_PORT: ${USER_DOCKER_MANAGER_PORT:-18082}
      # Public orchestrator URL; also injected into spawned userdockers so
      # they can self-register (outbound only).
      ORCHESTRATOR_URL: ${ORCHESTRATOR_PUBLIC_URL:?set ORCHESTRATOR_PUBLIC_URL to the hub orchestrator URL}
      NODE_NAME: ${NODE_NAME:?set a unique NODE_NAME for this machine}
      NODE_TOKEN: ${NODE_TOKEN:?set NODE_TOKEN to the hub's shared secret}
      USERDOCKER_DEFAULT_IMAGE: whalebot/userdocker-base:latest
      USERDOCKER_ALLOWED_IMAGES: ${USERDOCKER_ALLOWED_IMAGES:-whalebot/userdocker-base:latest,whalebot/userdocker-golang:latest}
      DOCKER_NETWORK: whalebot_net
      USERDOCKER_IDLE_HOURS: ${USERDOCKER_IDLE_HOURS:-24}
      USERDOCKER_IDLE_CHECK_SEC: ${USERDOCKER_IDLE_CHECK_SEC:-300}
      USERDOCKER_TEMP_TTL_SEC: ${USERDOCKER_TEMP_TTL_SEC:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [whalebot_net]
    depends_on:
      userdocker-base: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${USER_DOCKER_MANAGER_PORT:-18082}/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  userdocker-base:
    build:
      context: ./userdocker-base
      args:
        FINAL_BASE_IMAGE: alpine:3.20
    image: whalebot/userdocker-base:latest
    container_name: userdocker-base
    entrypoint: ["sleep"]
    command: ["infinity"]
    networks: [whalebot_net]
    restart: unless-stopped

  userdocker-golang:
    build:
      context: ./userdocker-base
      args:
        FINAL_BASE_IMAGE: golang:1.22-alpine
    image: whalebot/userdocker-golang:latest
    container_name: userdocker-golang
    entrypoint: ["sleep"]
    command: ["infinity"]
    networks: [whalebot_net]
    restart: unless-stopped
